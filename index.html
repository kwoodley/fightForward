<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fight Forward · Log in</title>
  <meta name="description" content="Log in to Fight Forward. Train the mind. Move the body. Build the future.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    main {
      flex: 1; display: grid; place-items: center;
      padding: clamp(24px, 6vw, 56px) var(--gutter);
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(217, 43, 47, 0.28), transparent 70%),
        linear-gradient(180deg, #0a0b12 0%, #141523 55%, #1d1216 100%);
    }
    .card { width: 100%; max-width: 860px; text-align: center; }
    .layout {
      display: grid; grid-template-columns: 1fr minmax(240px, 320px); column-gap: clamp(24px, 5vw, 56px);
      grid-template-areas: "head logo" "form logo" "fine eyebrow";
      grid-template-rows: auto auto auto; align-items: start;
    }
    .head { grid-area: head; text-align: left; }
    form { grid-area: form; } .fine { grid-area: fine; text-align: left; }
    .logo { grid-area: logo; align-self: start; width: clamp(200px, 30vw, 320px); height: auto; margin: -8px auto 0; display: block; mix-blend-mode: screen; }
    .card .eyebrow { grid-area: eyebrow; margin: 14px 0 0; line-height: 1.5; align-self: start; }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; grid-template-areas: "logo" "eyebrow" "head" "form" "fine"; }
      .logo { width: clamp(160px, 50vw, 220px); margin: 0 auto 12px; }
      .card .eyebrow { margin-bottom: 24px; }
    }
    h1 {
      font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
      font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0 0 6px;
    }
    h1 sup { font-size: 0.4em; vertical-align: super; }
    .card .eyebrow {
      display: block; text-align: center; white-space: nowrap;
      font-size: clamp(8px, 2.3vw, 10.5px); letter-spacing: 0.14em; padding-left: 0.14em;
    }
    .lede { color: var(--silver); margin: 0 0 26px; }
    .fine { margin: 14px 0 0; }

    form {
      text-align: left; display: grid; gap: 16px;
      background: var(--ink-2); border: 1px solid var(--ink-3); border-top: 3px solid var(--red);
      border-radius: var(--radius); padding: clamp(20px, 4vw, 28px);
    }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    input, select {
      font: inherit; font-size: 17px; color: var(--text);
      background: var(--ink); border: 1px solid var(--ink-3); border-radius: 10px;
      padding: 12px 14px; width: 100%;
    }
    input:focus-visible, select:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
    .error { color: #ff8f92; font-size: 14px; margin: 0; min-height: 1.4em; }
    form { align-self: start; }
    .btn { justify-content: center; font-size: 16px; padding: 13px 18px; }
    .fine { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="layout">
        <div class="head">
          <h1>Fight Forward<sup>™</sup></h1>
          <p class="lede">Interactive Youth Decision-Making Platform</p>
        </div>
        <form id="login" novalidate>
          <label>
            What’s your first name?
            <input id="name" name="name" type="text" autocomplete="given-name" maxlength="20" required placeholder="First name">
          </label>
          <p class="error" id="error" role="alert"></p>
          <button class="btn" type="submit">Log in</button>
        </form>
        <p class="fine">First name only. Please don’t type your last name or other private info.</p>
        <img class="logo" src="assets/badges/ff-final.png" alt="Fight Forward badge" width="1374" height="1145">
        <p class="eyebrow">Train the mind · Move the body · Build the future</p>
      </div>
    </div>
  </main>

  <footer>
    © 2026 Fight Forward Academy · Train the Mind. Move the Body. Build the Future.
  </footer>

  <script src="assets/js/auth.js"></script>
  <script>
    // Already logged in on this device: go straight to the welcome page.
    if (FFAuth.getUser() && !location.search.includes("switch")) location.replace("welcome.html");

    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const error = document.getElementById("error");
      if (!name.trim()) { error.textContent = "Type your first name to log in."; document.getElementById("name").focus(); return; }
      FFAuth.signIn(name);
      location.href = "welcome.html";
    });
  </script>
</body>
</html>
