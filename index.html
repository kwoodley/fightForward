<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fight Forward Academy · Log in</title>
  <meta name="description" content="Log in to Fight Forward Academy. Train the mind. Move the body. Build the future.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main {
      flex: 1; display: grid; place-items: center;
      padding: clamp(24px, 6vw, 56px) var(--gutter);
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(217, 43, 47, 0.28), transparent 70%),
        linear-gradient(180deg, #0a0b12 0%, #141523 55%, #1d1216 100%);
    }
    .card { width: 100%; max-width: 440px; text-align: center; }
    .logo { width: clamp(120px, 28vw, 170px); height: auto; margin: 0 auto 8px; display: block; }
    h1 {
      font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
      font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0 0 6px;
    }
    h1 span { color: var(--red); }
    .card .eyebrow {
      display: block; text-align: center; white-space: nowrap;
      font-size: clamp(8px, 2.3vw, 10.5px); letter-spacing: 0.14em; padding-left: 0.14em;
    }
    .lede { color: var(--silver); margin: 0 0 26px; }

    form {
      text-align: left; display: grid; gap: 16px;
      background: var(--ink-2); border: 1px solid var(--ink-3); border-top: 3px solid var(--red);
      border-radius: var(--radius); padding: clamp(20px, 4vw, 28px);
    }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    input, select {
      font: inherit; font-size: 17px; color: var(--text);
      background: var(--ink); border: 1px solid var(--ink-3); border-radius: 10px;
      padding: 12px 14px; width: 100%;
    }
    input:focus-visible, select:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
    .error { color: #ff8f92; font-size: 14px; margin: 0; min-height: 1.4em; }
    .btn { justify-content: center; font-size: 16px; padding: 13px 18px; }
    .fine { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="assets/badges/fight-forward-button.png" alt="Fight Forward badge" width="480" height="513">
      <p class="eyebrow">Train the mind · Move the body · Build the future</p>
      <h1>Fight Forward <span>Academy</span></h1>
      <p class="lede">Log in to step into the academy.</p>

      <form id="login" novalidate>
        <label>
          What’s your first name?
          <input id="name" name="name" type="text" autocomplete="given-name" maxlength="20" required placeholder="First name">
        </label>
        <label>
          What grade are you in?
          <select id="grade" name="grade" required>
            <option value="" selected disabled>Pick your grade</option>
            <option value="6">6th grade</option>
            <option value="7">7th grade</option>
            <option value="8">8th grade</option>
          </select>
        </label>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit">Log in</button>
      </form>
      <p class="fine">First name only. Please don’t type your last name or other private info.</p>
    </div>
  </main>

  <footer>
    © 2026 Fight Forward Academy · Train the Mind. Move the Body. Build the Future.
  </footer>

  <script src="assets/js/auth.js"></script>
  <script>
    // Already logged in on this device: go straight to the welcome page.
    if (FFAuth.getUser() && !location.search.includes("switch")) location.replace("welcome.html");

    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const grade = document.getElementById("grade").value;
      const error = document.getElementById("error");
      if (!name.trim()) { error.textContent = "Type your first name to log in."; document.getElementById("name").focus(); return; }
      if (!grade) { error.textContent = "Pick your grade to log in."; document.getElementById("grade").focus(); return; }
      FFAuth.signIn(name, grade);
      location.href = "welcome.html";
    });
  </script>
</body>
</html>
